# 依存更新は Dependabot に一本化する（renovate.json は未稼働のため撤去＝SPR-173 系の整理）。
# 方針: 低リスク（dev / minor / patch）はグルーピングして PR 乱発を抑え、破壊的更新（framework / auth）は
# 個別 or 手動に寄せて人がレビューする（CLAUDE.md §1 One-Way Door: better-auth / 破壊的変更は人が判断）。
# automerge は設定しない（採否の最終判断は唯一のレビュアー＝あなた）。

version: 2
updates:
  # --- npm（pnpm monorepo。ルートからワークスペース全体を走査）---
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 10
    # pnpm の minimumReleaseAge（公開後24時間はインストール拒否）と衝突しないよう、
    # 公開から2日未満のバージョンは提案しない（#598 の全ジョブ install 失敗の再発防止）
    cooldown:
      default-days: 2
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      # dev 依存（@types/* 含む）の minor/patch を 1 PR に集約
      dev-dependencies:
        dependency-type: "development"
        update-types: ["minor", "patch"]
      # production 依存の minor/patch を 1 PR に集約
      production-minor:
        dependency-type: "production"
        update-types: ["minor", "patch"]
    # 破壊的更新は手動レビューに回す（major はグルーピング対象外＝個別 PR で精査）
    ignore:
      # framework の major は四半期見直しで手動更新（CLAUDE.md 軸1: 破壊的変更は人がレビュー）
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      # 認証コアは major/minor とも手動（One-Way Door: better-auth/Discord 認証・認可）
      - dependency-name: "better-auth"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # next 16.3.1 のみ除外。Cloud Run の起動プローブが必ず落ちるため本番に載せられない。
      # 16.3.1 が同梱する @swc/helpers 0.5.23 は exports の先頭が module-sync で、Node >= 22.12 の
      # require はそちらに解決するが、Turbopack の tracing が条件を取り違えて cjs 側しか standalone に
      # 含めず MODULE_NOT_FOUND で exit(1) する（pnpm の仮想ストアで候補ディレクトリが2つになると発現）。
      # 上流 issue vercel/next.js#97358 ／ 修正 PR #97372 は canary にのみ入り 16.3.1 stable には未収録。
      # **この行の解除は不要**: 16.3.2 以降は通常どおり Dependabot が提案するので、
      # 出てきた PR の deploy が通れば解決、落ちれば同じ症状として即座に分かる。
      # @next/bundle-analyzer は版番号が next の release train に揃うだけの別パッケージで、
      # 依存は webpack-bundle-analyzer のみ・next にも @swc/helpers にも依存しない。
      # next.config が読むのはビルド時だけで standalone 出力には入らないため 16.3.1 のままでよい
      # （ここを exact pin すると「16.3.1 が危険」という誤った信号になり、dependabot とも綱引きになる）。
      - dependency-name: "next"
        versions: ["16.3.1"]

  # --- GitHub Actions（SPR-173 のようなアクション版上げを自動化）---
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
    groups:
      github-actions:
        patterns: ["*"]
