name: Terraform

# ADR-010 / SPR-99: terraform の plan と apply を 1 本で持つ（TF_VAR と plan 手順を二重管理しない）。
# - pull_request: read-only SA で plan して Job Summary に出すだけ（apply しない）
# - push(main) / workflow_dispatch(main): plan → GitHub Environment(production) 承認 → 保存した plan を apply
# ゲート: terraform-apply-sa の WIF は Environment(production) の job だけを信頼する（iam.tf・SPR-372）。
#         承認（required reviewer）と main 限定（deployment branch policy）は Environment の protection rules が担う。
# main 以外の ref で workflow_dispatch した場合は plan のみ（apply job は ref で弾く）。

on:
  pull_request:
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform.yml'
  push:
    branches: [main]
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# PR の plan は同じ ref の古い run を打ち切る。main（apply あり）は全 run を直列化し、
# 承認待ちを cancel しない（state lock と二重で安全）。
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('terraform-plan-{0}', github.ref) || 'terraform-apply' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TF_IN_AUTOMATION: 'true'
  # --- 非機密 config ---
  # current_env は var.environment で引かれる（locals.tf）。既定値も production（SPR-100）だが、
  # production workspace の state と揃えることを明示しておく。
  TF_VAR_environment: production
  TF_VAR_gcp_project_id: ${{ secrets.GCP_PROJECT_ID }}
  # default "suzumina-click" のままだと repo 名差で forces replacement の偽 plan になるため実値を渡す
  TF_VAR_artifact_registry_repository_id: suzumina-click-web
  TF_VAR_custom_domain: suzumina.click
  TF_VAR_domain_name: suzumina.click
  # --- 実値が必要な変数 ---
  # monitoring 通知先
  TF_VAR_admin_email: ${{ secrets.ADMIN_EMAIL }}
  # Cloudflare のトークンは workflow 全体に渡さない。plan は読み取り専用、apply は書き込み用を、
  # それぞれのステップだけに env で渡す（SPR-375・providers.tf）。
  # app 機密（Secret Manager の値）は terraform の変数にしない。値の正本は Secret Manager（secrets.tf・SPR-374）。

defaults:
  run:
    working-directory: terraform

jobs:
  plan:
    name: terraform plan (production)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Authenticate (read-only plan SA)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: 'projects/${{ secrets.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'terraform-plan-sa@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com'

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '1.13.5'
          terraform_wrapper: false

      - name: Init
        run: terraform init -input=false

      - name: Select production workspace
        run: terraform workspace select production

      - name: Plan (save to file)
        env:
          # 読み取り専用（Zone / Zone Settings / Cache Rules / DNS の Read）。PR の job にも渡るので書き込み権限は持たせない。
          # main の plan もこれで作る。トークンは plan ファイルに入らず、apply は apply job の env のトークンを使う。
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_READONLY }}
        run: |
          set -o pipefail
          # read-only SA は lock 書き込み不可のため plan は -lock=false。apply job 側で lock する。
          terraform plan -input=false -lock=false -out=tfplan.bin -no-color 2>&1 | tee /tmp/plan.txt

      - name: Plan summary
        if: always()
        env:
          NOTE: ${{ github.event_name == 'pull_request' && 'read-only SA による plan。apply は main マージ後に承認制で行う。' || '承認前にこの差分を確認する。承認すると保存したこの plan がそのまま apply される。' }}
        run: |
          {
            echo '## Terraform plan (production workspace)'
            echo ''
            echo "${NOTE}"
            echo ''
            # init 等の前段が失敗すると plan.txt は作られない。ここで tail が失敗すると
            # 「ファイルが無い」という 2 つ目のエラーで本当の原因が埋もれるため、前段の失敗を案内して終える。
            if [ -f /tmp/plan.txt ]; then
              echo '```hcl'
              # job summary 上限対策に末尾を優先表示（plan の Plan: 行は末尾付近）
              tail -c 60000 /tmp/plan.txt
              echo '```'
            else
              echo 'plan は実行されなかった（Init / workspace 選択など前段のステップのログを確認する）。'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # tfplan.bin は入力変数の値（TF_VAR_admin_email 等）と plan 時点の state を平文で含む（sensitive 指定でも同じ）。
      # public repo の artifact はログインした誰でもダウンロードできるため、暗号化してから渡す。
      # パスフレーズは argv に載せず env で渡す（openssl -pass env:）。agent 不要で runner に標準搭載。
      - name: Encrypt plan
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          TF_PLAN_PASSPHRASE: ${{ secrets.TF_PLAN_PASSPHRASE }}
        run: |
          if [ -z "${TF_PLAN_PASSPHRASE}" ]; then
            echo "::error::secret TF_PLAN_PASSPHRASE が未設定です（平文の plan はアップロードしない）"
            exit 1
          fi
          openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -salt \
            -pass env:TF_PLAN_PASSPHRASE -in tfplan.bin -out tfplan.bin.enc
          rm -f tfplan.bin

      - name: Upload plan artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: tfplan
          path: terraform/tfplan.bin.enc
          retention-days: 1
          if-no-files-found: error

  apply:
    name: apply (production / 承認ゲート)
    needs: plan
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # timeout-minutes は付けない（既定 360 分のまま）。Firestore index の作成は実測 39 分かかり、
    # provider 側 timeouts も 4h（firestore_indexes.tf）。ジョブ側で先に打ち切ると state lock と
    # 部分適用が残るため、terraform 自身のタイムアウトで失敗させる方が安全。
    # GitHub Environment(production) に required reviewer と deployment branch policy（main のみ）を設定しておくこと。
    # apply SA の WIF はこの Environment の subject だけを信頼する（SPR-372・iam.tf の terraform_apply_sa_wif）。
    # main 限定は branch policy が担う（上の if は workflow を書き換えたブランチでは効かない）。どちらを外してもゲートが消える。
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Authenticate (privileged apply SA / production 承認後のみ)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: 'projects/${{ secrets.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'terraform-apply-sa@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com'

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '1.13.5'
          terraform_wrapper: false

      - name: Init
        run: terraform init -input=false

      - name: Select production workspace
        run: terraform workspace select production

      - name: Download plan artifact
        uses: actions/download-artifact@v8
        with:
          name: tfplan
          path: terraform

      - name: Decrypt plan
        env:
          TF_PLAN_PASSPHRASE: ${{ secrets.TF_PLAN_PASSPHRASE }}
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 \
            -pass env:TF_PLAN_PASSPHRASE -in tfplan.bin.enc -out tfplan.bin

      - name: Apply saved plan
        env:
          # 書き込み用。Environment(production) の secret にだけ置く（repo の secret は PR の job からも参照できる）。
          # repo の secret と名前を分けておけば、repo 側に同名が登録されても参照されず、Environment に無ければ
          # 空のトークンで apply が失敗する（気づける）。同名にすると Environment 側が黙って優先される。
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_WRITE }}
        run: terraform apply -input=false tfplan.bin
