name: Chromatic

# packages/ui の Storybook を Chromatic にアップロードし視覚回帰(visual regression)を検出する（SPR-130）。
# play/a11y は storybook-test.yml、本番ビルド回帰は e2e-smoke.yml が担い、本 workflow は見た目の差分のみ担保する。
#
# コスト設計（無料枠 5,000 snapshots/月・1 フルビルド = 357 story）:
# - 自動実行は **push(main) のみ**。main は squash-only で commit が消えないため、main 同士の連鎖なら
#   TurboSnap の ancestor 探索（直近ビルドの commit を git で辿る）が壊れない。
#   PR ビルドは head commit が squash merge + ブランチ削除で GitHub から消え、Chromatic の baseline 集合に
#   「見つからない commit」を混ぜ続ける。2026-07〜09 は全ビルドがその置換先（#188 / 2026-07-11）まで遡り、
#   差分 555 ファイルに globals.css が含まれて毎回フルビルドになっていた（PR #929 の push(main) 復活でも直らず）。
# - pull_request は **`chromatic` ラベルを付けたときだけ**実行する（opt-in ゲート）。見た目に自信のない変更だけ
#   マージ前に確認し、それ以外は main ビルドの差分を見て必要なら revert する（戻せる変更＝Two-Way Door）。
# - paths-filter は「描画に効くファイル」に限定する。`packages/ui/package.json` や `vitest.d.ts` を触るだけの
#   依存更新 PR が `packages/ui/**` に一致して PR + main で 1,428 枚（見た目の変更ゼロ）を消費した（2026-09-22）。
# - 毎回 Job Summary に captured / inherited を出し、inherited が 0（TurboSnap が何も省けていない）なら warning を出す。
#   2026-07〜09 の空振りは 1 か月半だれも気づかなかった＝数字を毎回目に入れる。
# - draft PR 中は実行しない（開発中の連続 push でフルビルドを繰り返さないため）。

on:
  pull_request:
    branches:
      - main
    # `labeled` で opt-in する。opened は含めない（ラベル無しの PR では走らせない）。
    types: [labeled, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # main の run は打ち切らない。途中で切るとその commit のビルドが残らず、次回
  # 「直近ビルドの commit が見つからない」状態に戻ってフルビルドを誘発するため。
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  # debounce ステップの `gh api repos/.../pulls/{number}` 呼び出しに必要
  pull-requests: read

jobs:
  changes:
    name: Detect Changes
    # push(main) だけ paths-filter で絞る。PR はラベル、workflow_dispatch は常時実行なので判定不要。
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      ui: ${{ steps.changes.outputs.ui }}
    steps:
      - uses: actions/checkout@v7
        with:
          # push(main) では paths-filter が github.event.before とのローカル diff で判定する。
          # main ruleset は squash-only ＝ push は常に 1 コミットなので、depth 2 あれば before が手元に揃い
          # ネットワーク取得なしで確定する。取れなかった場合 paths-filter は自力で
          # `git fetch --depth=1 origin <sha>` するが、そこが失敗すると changes ジョブごと落ちて
          # chromatic が静かに skip され、ベースラインが立たない。ほぼ無料な保険として depth を明示する。
          fetch-depth: 2
      - uses: dorny/paths-filter@v4
        id: changes
        with:
          # `!` の除外は some-with-excludes でしか効かない（既定の some は除外を無視してマッチする）
          predicate-quantifier: some-with-excludes
          # 描画に効くファイルだけ。テスト・型宣言・package.json・lockfile は見た目を変えないので対象外
          # （依存起因の見た目の変化は workflow_dispatch のフルビルドで拾う）。
          # shared-types は ui がランタイム関数を import しているため src のみ含める。
          filters: |
            ui:
              - 'packages/ui/src/**'
              - '!packages/ui/src/**/__tests__/**'
              - '!packages/ui/src/**/*.test.*'
              - '!packages/ui/src/**/*.d.ts'
              - 'packages/ui/.storybook/**'
              - 'packages/shared-types/src/**'
              - '!packages/shared-types/src/**/__tests__/**'
              - '!packages/shared-types/src/**/*.test.*'
              - '.github/workflows/chromatic.yml'

  chromatic:
    name: Visual regression (Chromatic)
    runs-on: ubuntu-latest
    needs: changes
    # changes は push 以外 skip されるため always() で待ち合わせ、イベントごとに実行条件を分ける:
    # - push(main): paths-filter で ui 変更のみ（無関係な commit まで撮ると枠を食うだけ）
    # - pull_request: `chromatic` ラベル付き & draft でない。`labeled` は付けたラベルがそれ自身のときだけ
    #   （別ラベルの付与で再ビルドしない）。synchronize 等はラベルが付いている PR だけ
    # - workflow_dispatch: 常時（手動のベースライン更新が静かに no-op になるのを防ぐ）
    # Dependabot run には Actions secrets（CHROMATIC_PROJECT_TOKEN）が注入されず必ず失敗するため除外する。
    if: >
      always() &&
      github.actor != 'dependabot[bot]' &&
      (
        (github.event_name == 'push' && needs.changes.outputs.ui == 'true') ||
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'pull_request' &&
          github.event.pull_request.draft == false &&
          (
            (github.event.action == 'labeled' && github.event.label.name == 'chromatic') ||
            (github.event.action != 'labeled' && contains(github.event.pull_request.labels.*.name, 'chromatic'))
          )
        )
      )
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # TurboSnap は変更検出に git 履歴を使うため全履歴を取得する
          fetch-depth: 0

      - name: Debounce rapid successive pushes
        # PR に短時間で複数回 push された場合、古い commit の分は無駄なフルビルド消費になりうるため、
        # 少し待って PR head が自分自身のままか確認し、既に新しい commit がある（＝後続 run が来る）なら
        # このジョブは静かにスキップする。concurrency の cancel-in-progress の取りこぼしを補う簡易デバウンス。
        if: github.event_name == 'pull_request'
        id: debounce
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 60
          LATEST_SHA=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}" --jq .head.sha)
          if [ "$LATEST_SHA" != "${{ github.event.pull_request.head.sha }}" ]; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
          fi

      # pnpm 12 はネイティブバイナリを preinstall で配置するため、ビルドスクリプトを
      # 止める pnpm/action-setup では placeholder のまま壊れる。pnpm/setup は署名検証つきで
      # バイナリを直接取得し、Node も同時に用意する（actions/setup-node 不要）。
      # バージョンの正本は package.json の packageManager / devEngines.runtime。
      - name: Setup pnpm & Node.js
        if: steps.debounce.outputs.stale != 'true'
        uses: pnpm/setup@v2
        with:
          cache: true
          install: false

      - name: Install dependencies
        if: steps.debounce.outputs.stale != 'true'
        run: pnpm install --frozen-lockfile

      - name: Run Chromatic
        if: steps.debounce.outputs.stale != 'true'
        id: chromatic
        uses: chromaui/action@v18
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          workingDir: packages/ui
          buildScriptName: build-storybook
          # TurboSnap: 変更に関係する story のみスナップショット
          onlyChanged: true
          # lock の変更は依存トレースの起点にしない。packages/ui と同時に依存を足す PR で
          # 「lock が変わった → 依存グラフ全体が変更 → TurboSnap 無効」になるのを防ぐ。
          untraced: pnpm-lock.yaml
          # 視覚差分があっても GH チェックは成功させる（差分は Chromatic 上でレビュー＝段階的導入）
          exitZeroOnChanges: true
          # main では差分を新ベースラインとして自動採用（push(main) と workflow_dispatch で効く）
          autoAcceptChanges: main

      - name: Report snapshot usage
        # 撮った枚数を毎回 Job Summary に残す。inherited（TurboSnap が省いた分）が 0 なら
        # ベースライン切れの疑い＝ログの `we couldn't find the commit` / `TurboSnap disabled` を見る合図。
        if: steps.debounce.outputs.stale != 'true' && steps.chromatic.outputs.actualCaptureCount != ''
        env:
          CAPTURED: ${{ steps.chromatic.outputs.actualCaptureCount }}
          INHERITED: ${{ steps.chromatic.outputs.inheritedCaptureCount }}
          TESTS: ${{ steps.chromatic.outputs.testCount }}
          CHANGES: ${{ steps.chromatic.outputs.changeCount }}
          BUILD_URL: ${{ steps.chromatic.outputs.buildUrl }}
        run: |
          {
            echo "## Chromatic snapshot usage"
            echo
            echo "| captured (billed) | inherited (TurboSnap) | tests | changes |"
            echo "|---:|---:|---:|---:|"
            echo "| ${CAPTURED} | ${INHERITED} | ${TESTS} | ${CHANGES} |"
            echo
            echo "[Build](${BUILD_URL})"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${INHERITED:-0}" -eq 0 ] && [ "${CAPTURED:-0}" -gt 0 ]; then
            echo "::warning title=TurboSnap did not skip any story::captured=${CAPTURED} inherited=0. Check the Chromatic log for 'we couldn't find the commit' / 'TurboSnap disabled due to file change' (baseline may be broken)."
          fi
