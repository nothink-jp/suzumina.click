name: Storybook Test

# packages/ui の story を play(interaction) テストとして browser モード(vitest + playwright)で実行する（SPR-121）。
# a11y は現状 "todo"（可視化のみ・非 fail。違反修正後に "error" へ → SPR-129）。
# 本番ビルド限定回帰は e2e-smoke.yml が担い、こちらは story 単位の振る舞いを担保する。

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ui: ${{ steps.changes.outputs.ui }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            ui:
              - 'packages/ui/**'
              - 'packages/shared-types/**'
              - 'pnpm-lock.yaml'
              - '.github/workflows/storybook-test.yml'

  storybook:
    name: Story play tests (browser)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm & install
        uses: ./.github/actions/setup-pnpm

      # --with-deps は付けない。ubuntu-24.04 runner は chromium の共有ライブラリを同梱済みで、
      # --with-deps が足すのはフォント（CJK 等）と既存パッケージの更新だけ。その apt-get が
      # Azure ミラーの速度次第で 10 分超かかっていた（ブラウザ本体の DL は数秒）。
      # テストは DOM 検証のみでスクリーンショット比較を持たないためフォントは不要。
      # runner イメージ更新でライブラリが欠けたら launch が "missing dependencies" で落ちるので、そのとき戻す
      - name: Install Playwright (chromium)
        run: pnpm --filter @suzumina.click/ui exec playwright install chromium

      - name: Run Storybook play tests
        run: pnpm --filter @suzumina.click/ui test:storybook
