name: Knip (unused code)

# monorepo 全体の未使用 export / ファイル / 依存を knip で棚卸しする（SPR-117）。
# 方針: 非ブロッキング（continue-on-error）。PR を fail させず、結果はジョブログで可視化するだけ。
# 削除判断はツール任せにせず 1 つずつ人=LLM が行う前提（CLAUDE.md 軸1/軸3）。
# 設定は knip.json。Biome（ファイル内未使用）とは役割が異なり競合しない。

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  knip:
    name: Unused code report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # pnpm 12 はネイティブバイナリを preinstall で配置するため、ビルドスクリプトを
      # 止める pnpm/action-setup では placeholder のまま壊れる。pnpm/setup は署名検証つきで
      # バイナリを直接取得し、Node も同時に用意する（actions/setup-node 不要）。
      # バージョンの正本は package.json の packageManager / devEngines.runtime。
      - name: Setup pnpm & Node.js
        uses: pnpm/setup@v2
        with:
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 非ブロッキング: 検出があっても PR を落とさない。結果はこのステップのログで確認する。
      - name: Run knip
        continue-on-error: true
        run: pnpm knip --no-progress
