name: Security Scan

on:
  schedule:
    - cron: '0 2 * * 1'  # Weekly on Monday at 2:00 AM UTC
  workflow_dispatch:
  push:
    branches:
      - main
    # 依存解決・イメージ構成に影響するファイル。pnpm-workspace.yaml(overrides の正本) と
    # apps/web/Dockerfile を含める(以前は欠落し、Dockerfile/ベースイメージ単独の変更では
    # コンテナスキャンが走らず退行を見逃していた)
    paths: &scan-paths
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'apps/*/package.json'
      - 'packages/*/package.json'
      - 'apps/web/Dockerfile'
      - '.github/workflows/security-scan.yml'
  # マージ前にイメージ/依存スキャンを走らせる(以前は push 後の main でしか走らず、
  # PR 時点で脆弱性を検出できなかった)。paths は push と同一(アンカーで同期しドリフト再発を防ぐ)
  pull_request:
    branches:
      - main
    paths: *scan-paths

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  dependency-scan:
    name: Dependency Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      
      - name: Setup pnpm & install
        uses: ./.github/actions/setup-pnpm
      
      # PR を止めるゲート（moderate 以上）。該当があれば一覧はこのステップのログに出る。
      # audit の結果は lockfile だけで決まるので、lockfile を変える PR はこの workflow の paths で
      # 過不足なく拾える（PR タイトルの文字列で判定するより確実）。schedule / main push でも赤くなる＝新規 CVE の通知になる。
      - name: Audit gate (moderate+)
        run: pnpm audit --audit-level moderate

  container-scan:
    name: Container Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # ホストの pnpm install は不要（node_modules は .dockerignore で除外され、Dockerfile 内で入れ直す）
      - name: Build Docker image
        run: |
          docker build -f apps/web/Dockerfile -t suzumina-click:latest .
      
      - name: Run Trivy vulnerability scanner
        # @master は未検証の最新 commit 追跡になるためタグ固定（Dependabot github-actions が自動更新する）
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'suzumina-click:latest'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
      
      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true
      
      # 脆弱性確認の正本は SARIF（GitHub Security タブ）。旧ステップは同一イメージの再スキャン＋未固定イメージ（aquasec/trivy:latest）だったため撤去。

      - name: Upload container scan results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: container-scan-results
          path: |
            trivy-results.sarif
          retention-days: 7
