name: Security Scan

on:
  schedule:
    - cron: '0 2 * * 1'  # Weekly on Monday at 2:00 AM UTC
  workflow_dispatch:
  push:
    branches:
      - main
    # 依存解決・イメージ構成に影響するファイル。pnpm-workspace.yaml(overrides の正本) と
    # apps/web/Dockerfile を含める(以前は欠落し、Dockerfile/ベースイメージ単独の変更では
    # コンテナスキャンが走らず退行を見逃していた)
    paths: &scan-paths
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'apps/*/package.json'
      - 'packages/*/package.json'
      - 'apps/web/Dockerfile'
      - '.github/workflows/security-scan.yml'
      # 依存 audit の差分ゲート本体（改修を当該 PR 上で自己検証する）
      - 'scripts/audit-diff.mjs'
  # マージ前にイメージ/依存スキャンを走らせる(以前は push 後の main でしか走らず、
  # PR 時点で脆弱性を検出できなかった)。paths は push と同一(アンカーで同期しドリフト再発を防ぐ)
  pull_request:
    branches:
      - main
    paths: *scan-paths

# PR の古い run は打ち切り、main（push / schedule）の run は打ち切らない（chromatic.yml と同じ方式）。
# main のスキャン結果は SARIF として Security タブに残るため、実行中の run を途中で切らない。
# 待機中の run は後続で置き換わり得るが、後の run が最新の main をスキャンするので欠落にはならない。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  dependency-scan:
    name: Dependency Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Setup pnpm & install
        uses: ./.github/actions/setup-pnpm
      
      # audit の結果は lockfile と pnpm-workspace.yaml の auditConfig.ignoreGhsas（除外する advisory の正本）で決まる。
      # どちらもこの workflow の paths に入っているので、結果を変える PR は過不足なく拾える。
      #
      # PR は差分ゲート（SPR-392）: PR が新しく持ち込んだ advisory（moderate 以上）だけで落とし、
      # main に元からある advisory は警告と job summary に一覧を出すだけにする。全量ゲートだった頃は
      # main に新しい advisory が出ると依存 PR が全部赤くなり、脆弱性の修正 PR 同士が互いを塞いだ（#1067 / #1068）。
      # base 側は lockfile だけを別ディレクトリに置いて audit する（audit は install 不要）。
      # 設定は両側とも PR 側を使う: pnpm-workspace.yaml（auditConfig）で除外の基準を揃え、
      # package.json（packageManager）で pnpm の版を揃える（base の package.json だと pnpm を上げる PR で
      # base 側だけ旧版の pnpm が audit し、出力形式の差で誤って落ちうる）。audit が読むのは lockfile のみ。
      - name: Audit gate (PR diff, moderate+)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          base_dir="$RUNNER_TEMP/audit-base"
          mkdir -p "$base_dir"
          git show "$BASE_SHA:pnpm-lock.yaml" > "$base_dir/pnpm-lock.yaml"
          cp package.json pnpm-workspace.yaml "$base_dir/"

          # advisory があると pnpm audit は非ゼロで終わるため終了コードは見ない。
          # JSON として読めない出力（registry 障害等）は audit-diff.mjs が fail-closed で落とす。
          (cd "$base_dir" && pnpm audit --json > "$RUNNER_TEMP/audit-base.json") || true
          pnpm audit --json > "$RUNNER_TEMP/audit-head.json" || true
          node scripts/audit-diff.mjs "$RUNNER_TEMP/audit-base.json" "$RUNNER_TEMP/audit-head.json"

      # main（push / schedule）は全量ゲート。main に残っている既知の advisory はここで赤くなる。
      - name: Audit gate (full, moderate+)
        if: github.event_name != 'pull_request'
        run: pnpm audit --audit-level moderate

  container-scan:
    name: Container Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ホストの pnpm install は不要（node_modules は .dockerignore で除外され、Dockerfile 内で入れ直す）
      - name: Build Docker image
        run: |
          docker build -f apps/web/Dockerfile -t suzumina-click:latest .
      
      - name: Run Trivy vulnerability scanner
        # タグは付け替えられる（CVE-2026-33634 で trivy-action のタグが改ざんされた）ため commit SHA で固定する。
        # 全 uses: 共通の方針（SPR-363）。Dependabot github-actions が SHA と末尾のバージョンコメントを更新する
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: 'suzumina-click:latest'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
      
      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true
      
      # 脆弱性確認の正本は SARIF（GitHub Security タブ）。旧ステップは同一イメージの再スキャン＋未固定イメージ（aquasec/trivy:latest）だったため撤去。

      - name: Upload container scan results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: container-scan-results
          path: |
            trivy-results.sarif
          retention-days: 7
